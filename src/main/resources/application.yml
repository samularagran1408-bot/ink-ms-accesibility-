spring:
  application:
    name: ink-ms-accessibility
  
  data:
    mongodb:
      uri: mongodb://localhost:27017/accessibility_notifications_db
      auto-index-creation: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: ${MAIL_PROTOCOL:smtps}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
  
  main:
    allow-bean-definition-overriding: true

server:
  port: 3004

mail:
  enabled: ${MAIL_ENABLED:false}

jwt:
  secret: ${JWT_SECRET:inklusport2024superSecretKeyForJWTtokenGenerationWith512bitsAlgorithmHS512}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.inklusport.accessibility: DEBUG
    org.mongodb.driver: DEBUG