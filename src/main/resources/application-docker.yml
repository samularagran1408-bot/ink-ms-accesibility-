spring:
  application:
    name: ink-ms-accessibility
  
  data:
    mongodb:
      # Sin valor por defecto: la URI lleva usuario y contraseña dentro, así que no
      # debe quedar escrita en el repositorio.
      uri: ${MONGODB_URI}
      database: ${MONGODB_DB:accessibility_notifications_db}
      auto-index-creation: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: ${MAIL_PROTOCOL:smtps}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
  
  main:
    allow-bean-definition-overriding: true

server:
  port: 3004

mail:
  enabled: ${MAIL_ENABLED:false}

jwt:
  # Sin valor por defecto a propósito: si falta la variable el servicio no arranca,
  # en lugar de validar tokens con un secreto conocido.
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://auth-service:3001}

security:
  basic:
    enabled: false

logging:
  level:
    com.inklusport.accessibility: ${LOG_LEVEL:DEBUG}